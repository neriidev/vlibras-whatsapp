name: Provision and Deploy to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  provision_and_deploy:
    name: "Provision and Deploy"
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Limpeza da Infraestrutura Antiga (Destroy)
        run: |
          echo "Buscando instancias antigas..."
          INSTANCE_ID=$(aws ec2 describe-instances --filters "Name=tag:Name,Values=vlibras-whatsapp-server" "Name=instance-state-name,Values=running,stopped,pending,shutting-down" --query "Reservations[*].Instances[*].InstanceId" --output text)
          
          if [ -n "$INSTANCE_ID" ]; then
            echo "Terminando instancia $INSTANCE_ID..."
            aws ec2 terminate-instances --instance-ids $INSTANCE_ID
            echo "Aguardando termino da instancia..."
            aws ec2 wait instance-terminated --instance-ids $INSTANCE_ID
          fi
          
          echo "Limpando Security Group antigo..."
          aws ec2 delete-security-group --group-name vlibras_security_group || true
          
          echo "Limpando Chave SSH antiga..."
          aws ec2 delete-key-pair --key-name vlibras-deploy-key || true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve
        
      - name: Obter Outputs do Terraform
        id: tf_outputs
        working-directory: terraform
        run: |
          EC2_IP=$(terraform output -raw ec2_public_ip)
          echo "ec2_public_ip=$EC2_IP" >> $GITHUB_OUTPUT
          
          # Salvar a chave privada de forma segura no GITHUB_OUTPUT
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "private_key<<$EOF" >> $GITHUB_OUTPUT
          terraform output -raw private_key_pem >> $GITHUB_OUTPUT
          echo "$EOF" >> $GITHUB_OUTPUT

      - name: Wait for EC2 to Boot
        run: sleep 60 # Espera 1 minuto para o Ubuntu e SSH iniciarem
        
      - name: Executar comandos via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ steps.tf_outputs.outputs.ec2_public_ip }}
          username: ubuntu
          key: ${{ steps.tf_outputs.outputs.private_key }}
          script: |
            # Navegar até a pasta do projeto
            cd /home/ubuntu
            
            if [ ! -d "vlibras-whatsapp" ]; then
              git clone https://github.com/neriidev/vlibras-whatsapp.git
            fi
            
            cd vlibras-whatsapp
            git pull origin main
            docker-compose up -d postgres redis
            sleep 10
            docker-compose up -d --build
