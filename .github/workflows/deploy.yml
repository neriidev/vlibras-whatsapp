name: Provision and Deploy to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  provision_and_deploy:
    name: "Provision and Deploy"
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve
        
      - name: Obter Outputs do Terraform
        id: tf_outputs
        working-directory: terraform
        run: |
          EC2_IP=$(terraform output -raw ec2_public_ip)
          echo "ec2_public_ip=$EC2_IP" >> $GITHUB_OUTPUT
          
          # Salvar a chave privada em um arquivo temporário
          terraform output -raw private_key_pem > ../deploy_key.pem
          chmod 600 ../deploy_key.pem

      - name: Wait for EC2 to Boot
        run: sleep 60 # Espera 1 minuto para o Ubuntu e SSH iniciarem
        
      - name: Executar comandos via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ steps.tf_outputs.outputs.ec2_public_ip }}
          username: ubuntu
          key_path: ./deploy_key.pem
          script: |
            # Navegar até a pasta do projeto
            cd /home/ubuntu
            
            if [ ! -d "vlibras-whatsapp" ]; then
              git clone https://github.com/neriidev/vlibras-whatsapp.git
            fi
            
            cd vlibras-whatsapp
            git pull origin main
            docker-compose up -d postgres redis
            sleep 10
            docker-compose up -d --build
